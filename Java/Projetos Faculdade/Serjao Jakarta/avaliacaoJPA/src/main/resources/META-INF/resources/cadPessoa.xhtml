<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html lang="en-us"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
    <title>Cadastro - Pessoa</title>
    <h:outputScript name="primefaces/locales/locale-pt.js"/>
</h:head>
<h:body>

    <h:form>
        <p:panel header="Cadastro de Pessoas">
            <p:messages id="mensagem_confirmacao" closable="true"/>

            <h:panelGrid id="campos">
                <p:outputLabel value="Código"/>
                <p:inputText rendered="true" maxlength="5" value="#{pessoaController.p.id}" readonly="true"/>

                <p:outputLabel value="Nome:"/>
                <p:inputText maxlength="100" value="#{pessoaController.p.nome}"
                             required="true" requiredMessage="O campo nome é obrigadorio!"/>

                <p:outputLabel value="CPF:"/>
                <p:inputText maxlength="11" value="#{pessoaController.p.cpf}" mask="999.999.999-99"
                             required="true" requiredMessage="O campo CPF é obrigadorio!"
                             converterMessage="Informe um valor válido! (apenas números)"/>

                <p:outputLabel value="Data de nascimento:"/>
                <p:calendar navigator="true" yearRange="c-100:c+100"  readonlyInput="true"
                            pattern="dd/MM/yyyy" value="#{pessoaController.p.dtNascimento}"
                            required="true" requiredMessage="O campo data é obrigadorio!"/>

                <p:commandButton value="Cadastrar!"
                                 actionListener="#{pessoaController.salvar()}"
                                 update="mensagem_confirmacao campos"/>
            </h:panelGrid>

        </p:panel>
    </h:form>

</h:body>
</html>
