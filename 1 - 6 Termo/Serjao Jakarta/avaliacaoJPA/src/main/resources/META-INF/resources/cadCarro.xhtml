<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html lang="en-us"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
    <title>Cadastro - Carro</title>
    <h:outputScript name="primefaces/locales/locale-pt.js"/>
</h:head>
<h:body>

    <h:form>
        <p:panel header="Cadastro de Carro">

            <p:messages id="mensagem_confirmacao" closable="true"/>

            <h:panelGrid id="campos">
                <p:outputLabel value="Código"/>
                <p:inputText size="4" rendered="true" maxlength="5" value="#{carroController.carro.cod}" readonly="true"/>

                <p:outputLabel value="Marca"/>
                <p:inputText maxlength="20" value="#{carroController.carro.marca}"
                             required="true" requiredMessage="O campo Marca é obrigadorio!"/>

                <p:outputLabel value="Modelo"/>
                <p:inputText maxlength="20" value="#{carroController.carro.modelo}"
                             required="true" requiredMessage="O campo Modelo é obrigadorio!"/>

                <p:outputLabel value="Ano de Fabricação"/>
                <p:inputText size="4" maxlength="4" value="#{carroController.carro.ano_fab}"
                             required="true" requiredMessage="O campo Ano de Fabricação é obrigadorio!"
                             converterMessage="Informe um valor válido! (apenas números)"/>

                <p:outputLabel value="Ano do modelo"/>
                <p:inputText size="4" maxlength="4" value="#{carroController.carro.ano_mod}"
                             required="true" requiredMessage="O campo Ano do Modelo é obrigadorio!"
                             converterMessage="Informe um valor válido! (apenas números)"/>




                <p:commandButton value="Cadastrar!"
                                 actionListener="#{carroController.salvar()}"
                                 update="mensagem_confirmacao campos"/>

            </h:panelGrid>

        </p:panel>
    </h:form>

</h:body>
</html>
